<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4df9ff"/>
      <stop offset="50%" stop-color="#2e70ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#4df9ff"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep space back circle -->
  <circle cx="50" cy="50" r="46" fill="#040816" stroke="url(#cosmicGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Orbital trajectory ring 1 (inclined ellipse) -->
  <ellipse cx="50" cy="50" rx="38" ry="16" transform="rotate(-30 50 50)" stroke="url(#silverGlow)" stroke-width="1.8" stroke-dasharray="85 12" stroke-linecap="round"/>

  <!-- Orbital trajectory ring 2 (counter-inclined) -->
  <ellipse cx="50" cy="50" rx="34" ry="13" transform="rotate(40 50 50)" stroke="url(#cosmicGrad)" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- Celestial Core Node with Glow -->
  <circle cx="50" cy="50" r="8.5" fill="url(#silverGlow)" filter="url(#coreGlow)"/>
  <circle cx="50" cy="50" r="4" fill="#040816"/>

  <!-- Orbiting Satellites / Stellar bodies -->
  <circle cx="78" cy="34" r="3.2" fill="#4df9ff" filter="url(#coreGlow)"/>
  <circle cx="26" cy="68" r="2.4" fill="#a855f7"/>
  <circle cx="68" cy="62" r="1.8" fill="#ffffff"/>
</svg>
